version: "3.8"
services:
  web:
    build: ./web
    volumes:
      - ./data:/data   # mount CSVs to /data
    ports:
      - "8050:8050"
    restart: unless-stopped
    environment:
      - PORT=8050

  worker:
    build: ./worker
    volumes:
      - ./data:/data   # mount CSVs to /data
    restart: unless-stopped
    environment:
      - TZ=Europe/London  
